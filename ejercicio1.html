<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicio 1 - Bootstrap 5</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header class="bg-dark text-white py-3">
<div class="container">
<h1 class="h4 mb-1">ESCUELA DE INGENIERÍA EN COMPUTACIÓN</h1>
<p class="mb-0">Carrera: Ingeniería en Desarrollo de Software · Modalidad: Presencial · Materia: Diseño Web Adaptable</p>
</div>
</header>
<main class="container py-4">
<h2 class="mb-4">Ejercicio 1: formulario básico en Bootstrap 5</h2>
<form class="col-12 col-md-8 col-lg-6">
<div class="mb-3"><label for="correo" class="form-label">Correo electrónico</label><input type="email" class="form-control" id="correo"></div>
<div class="mb-3"><label for="clave" class="form-label">Contraseña</label><input type="password" class="form-control" id="clave"></div>
<div class="mb-3 form-check"><input type="checkbox" class="form-check-input" id="recordarme"><label class="form-check-label" for="recordarme">Recordarme</label></div>
<button type="submit" class="btn btn-primary">Enviar</button>
</form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
