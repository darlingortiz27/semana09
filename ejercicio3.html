<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicio 3 - Pedido</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header class="bg-dark text-white py-3">
<div class="container">
<h1 class="h4 mb-1">ESCUELA DE INGENIERÍA EN COMPUTACIÓN</h1>
<p class="mb-0">Carrera: Ingeniería en Desarrollo de Software · Modalidad: Presencial · Materia: Diseño Web Adaptable</p>
</div>
</header>
<main class="container py-4">
<h2 class="mb-4">Ejercicio 3: pedido de artesanías</h2>
<form><div class="row g-3">
<div class="col-12 col-md-6"><div class="form-floating"><select class="form-select" id="producto"><option selected disabled>Seleccione...</option><option>Cerámica</option><option>Textiles</option><option>Madera tallada</option></select><label for="producto">Producto</label></div></div>
<div class="col-12 col-md-6"><div class="form-floating"><select class="form-select" id="categoria"><option selected disabled>Seleccione...</option><option>Decoración</option><option>Uso doméstico</option><option>Regalo</option></select><label for="categoria">Categoría</label></div></div>
<div class="col-12 col-md-6"><label for="precio" class="form-label">Precio unitario</label><div class="input-group"><span class="input-group-text">$</span><input type="number" class="form-control" id="precio"><span class="input-group-text">USD</span></div></div>
<div class="col-12 col-md-6"><label for="cantidad" class="form-label">Cantidad: <span id="cantidadValor">10</span></label><input type="range" class="form-range" id="cantidad" min="1" max="20" value="10"></div>
<div class="col-12"><label for="foto" class="form-label">Fotografía del producto</label><input class="form-control" type="file" id="foto" accept="image/*"></div>
<div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="envio"><label class="form-check-label" for="envio">Envío a domicilio</label></div></div>
<div class="col-12"><button class="btn btn-primary">Agregar al pedido</button></div>
</div></form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById("cantidad").addEventListener("input", function(e) {
  document.getElementById("cantidadValor").textContent = e.target.value;
});
</script>
</body>
</html>
